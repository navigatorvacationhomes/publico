# Checagem "decisoes" reutilizável (regra 28 do AGENTS.md do cofre). Programa e teste em .github/scripts/.
name: decisoes-reutilizavel
on:
  workflow_call:
permissions:
  contents: read
jobs:
  decisoes:
    name: decisoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navigatorvacationhomes/publico
          path: .publico
      - name: Teste de regressão da própria checagem
        run: cd .publico/.github/scripts && python3 testa_decisoes.py
      - name: Registro de decisão aprovado não se edita (regra 28 do AGENTS.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .publico/.github/scripts/decisoes.py
