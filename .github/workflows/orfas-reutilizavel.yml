# Checagem "orfas", escrita uma vez só e chamada pelos repositórios da
# Navigator. Todo arquivo do repositório que a chamou precisa de link no
# README.md da pasta (regra 28 do AGENTS.md do cofre). O programa e o teste
# ficam aqui no publico, em .github/scripts/.
name: orfas-reutilizavel
on:
  workflow_call:
permissions:
  contents: read
jobs:
  orfas:
    name: orfas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: navigatorvacationhomes/publico
          path: .publico
      - name: Teste de regressão da própria checagem
        run: cd .publico/.github/scripts && python3 testa_orfas.py
      - name: Todo arquivo com link no README.md da pasta (regra 28 do AGENTS.md)
        run: python3 .publico/.github/scripts/orfas.py
